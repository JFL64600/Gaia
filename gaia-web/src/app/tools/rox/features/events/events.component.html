<gaia-events-page [events]="events()" [canCreate]="!readonly()" [creating]="creating()"
  (create)="startCreating()" (remove)="remove($event.id, $event.name)">
  @if (creating() && !readonly()) {
    <gaia-event-creation
      [title]="i18n.t('events.new')"
      [description]="i18n.t('events.nameHint')"
      [nameLabel]="i18n.t('events.name')"
      [namePlaceholder]="i18n.t('events.namePlaceholder')"
      [nameMaxLength]="nameMaxLength"
      [nameValue]="pendingName()"
      [focusName]="true"
      [submitLabel]="i18n.t('common.add')"
      [cancelLabel]="i18n.t('common.cancel')"
      [submitDisabled]="!canCreate()"
      (save)="create()"
      (cancel)="cancelCreating()"
      (nameChange)="updateName($event)"
    >
      <div class="resume-option">
        <span class="field-label">{{ i18n.t('events.resume') }}</span>
        <button
          class="resume-toggle"
          name="eventResumeEnabled"
          type="button"
          role="switch"
          [attr.aria-checked]="pendingResumeEnabled()"
          [attr.aria-label]="i18n.t('events.resume')"
          [attr.title]="i18n.t('events.resume')"
          (click)="toggleResumeEnabled()"
        >
          <span class="resume-toggle-thumb" aria-hidden="true"></span>
        </button>
      </div>
    </gaia-event-creation>
  }

</gaia-events-page>
