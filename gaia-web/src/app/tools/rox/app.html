<header class="gaia-header">
  <div class="gaia-header-group">
    <gaia-brand suffix="Rox" />
    @if (chronometerStore.eventName(); as eventName) {
      <span class="event-title">- {{ eventName }}</span>
    }
    @if (chronometerStore.currentRoom()) {
      <button
        type="button"
        class="copy-link"
        [attr.aria-label]="i18n.t('sync.copyLink')"
        [attr.title]="i18n.t('sync.copyLink')"
        (click)="copyLink()"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path
            d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z"
          />
        </svg>
      </button>
    }
  </div>
  <div class="gaia-header-controls">
    <gaia-preferences />
    @if (showRankingPicker()) {
      <div class="language-switch" role="group" [attr.aria-label]="i18n.t('ranking.style')">
        @for (option of rankingStyles; track option.id) {
          <button
            type="button"
            [attr.aria-pressed]="rankingService.style() === option.id"
            (click)="rankingService.setStyle(option.id)"
          >
            {{ i18n.t(option.labelKey) }}
          </button>
        }
      </div>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>
