<div class="app-shell">
  <header class="gaia-header">
    <div class="gaia-header-group">
      <gaia-brand suffix="Scores" />
    </div>

    <div class="gaia-header-controls">
      <gaia-preferences />
    </div>
  </header>

  <main class="content">
    <gaia-events-page [events]="eventStore.events()" [creating]="creating()" [canCreate]="mode.admin()"
      [loading]="eventStore.loading()" [error]="eventStore.error()"
      [(query)]="searchTerm" (create)="startCreating()">
      @if (mode.admin() && creating()) {
        <gaia-event-creation
          [title]="i18n.t('events.new')"
          [description]="i18n.t('events.nameHint')"
          [nameLabel]="i18n.t('events.name')"
          [namePlaceholder]="i18n.t('events.namePlaceholder')"
          [nameMaxLength]="nameMaxLength"
          [nameValue]="pendingName()"
          [nameDisabled]="saving()"
          [focusName]="true"
          [submitLabel]="saving() ? i18n.t('events.saving') : i18n.t('common.add')"
          [cancelLabel]="i18n.t('common.cancel')"
          [submitDisabled]="!validEvent() || saving()"
          [cancelDisabled]="saving()"
          (save)="createEvent()"
          (cancel)="cancelCreating()"
          (nameChange)="updatePendingName($event)"
        >
          <label class="field-label" for="event-teams">{{ i18n.t('events.teams') }}</label>
          <input
            id="event-teams"
            name="teamCount"
            type="number"
            required
            min="1"
            max="100"
            step="1"
            [disabled]="saving()"
            [value]="pendingTeamCount()"
            (input)="updateTeamCount($event)"
            aria-describedby="teams-hint"
          />
          <p class="field-hint" id="teams-hint">{{ i18n.t('events.teamsHint') }}</p>
          <fieldset class="games-field" [disabled]="saving()">
            <legend>{{ i18n.t('events.games') }}</legend>
            <p class="field-hint">{{ i18n.t('events.gamesHint') }}</p>
            <div class="games-list">
              @for (game of games(); track game.code) {
                <label class="game-option">
                  <input
                    type="checkbox"
                    [checked]="pendingGameIds().includes(game.code)"
                    (change)="toggleGame(game.code)"
                  />
                  <span>{{ game.label }}</span>
                  <span class="game-role">{{ i18n.t(game.role === 'Time' ? 'games.role.time' : 'games.role.point') }}</span>
                </label>
              } @empty {
                <p class="field-hint">{{ i18n.t('events.gamesLoading') }}</p>
              }
            </div>
          </fieldset>
        </gaia-event-creation>
      }

    </gaia-events-page>
  </main>
</div>
