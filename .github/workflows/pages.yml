name: Deploy Gaia to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - gaia-web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: gaia-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gaia-web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: gaia-web/dist/gaia-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
